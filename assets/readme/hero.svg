      <rect width="74" height="38" rx="10" fill="#15243A" stroke="#31506F"/>
      <text x="37" y="25" text-anchor="middle" fill="#D8E9F7">2D</text>
      <rect x="86" width="74" height="38" rx="10" fill="#15243A" stroke="#31506F"/>
      <text x="123" y="25" text-anchor="middle" fill="#D8E9F7">3D</text>
      <rect x="172" width="92" height="38" rx="10" fill="#15243A" stroke="#31506F"/>
      <text x="218" y="25" text-anchor="middle" fill="#D8E9F7">2.5D</text>
      <rect x="276" width="142" height="38" rx="10" fill="#15243A" stroke="#31506F"/>
      <text x="347" y="25" text-anchor="middle" fill="#D8E9F7">ISOMETRIC</text>
      <rect x="430" width="102" height="38" rx="10" fill="#15243A" stroke="#31506F"/>
      <text x="481" y="25" text-anchor="middle" fill="#D8E9F7">WEB</text>
