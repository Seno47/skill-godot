    <text x="0" y="82" fill="#F5F8FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="760" letter-spacing="-2">skill-godot</text>
    <text x="0" y="132" fill="#B9C7D8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">From a playable brief to a verified, editable game.</text>

