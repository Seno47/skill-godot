<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">skill-godot — production Godot game development for Codex</title>
  <desc id="desc">A project-native hero showing an editable Godot scene flowing through resources and deterministic probes into verified evidence.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111B31"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="tile-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#70C9FF"/>
      <stop offset="1" stop-color="#3F91CF"/>
    </linearGradient>
    <linearGradient id="tile-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE39A"/>
      <stop offset="1" stop-color="#E6A936"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#080D19"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#23324B" stroke-width="2"/>
  <path d="M734 0V420" stroke="#1B2940"/>
  <path d="M760 357H1144" stroke="#1B2940"/>

  <g id="title-block" transform="translate(64 54)">
