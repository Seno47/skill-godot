    <g transform="translate(0 268)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="0" y="0" fill="#F5F8FF" font-size="22" font-weight="700">20</text>
      <text x="34" y="0" fill="#8396AC" font-size="18">production guides</text>
      <text x="234" y="0" fill="#F5F8FF" font-size="22" font-weight="700">12</text>
      <text x="268" y="0" fill="#8396AC" font-size="18">audit helpers</text>
      <text x="438" y="0" fill="#F5F8FF" font-size="22" font-weight="700">4</text>
      <text x="458" y="0" fill="#8396AC" font-size="18">Godot probes</text>
    </g>
  </g>

  <g id="scene-pipeline" transform="translate(762 32)">
